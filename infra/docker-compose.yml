services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-server
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_PORT=5678
      - N8N_HOST=0.0.0.0
      - WEBHOOK_URL=http://SEU_IP_VPS:5678/
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./shared:/data/shared
    networks:
      - automation-net

  linkedin-bridge:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: linkedin-bridge
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./worker:/app
      - ./linkedin_session:/app/session
      - ./shared:/app/shared
    networks:
      - automation-net

networks:
  automation-net:
    driver: bridge
