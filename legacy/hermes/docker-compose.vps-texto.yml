services:
  config-init:
    image: busybox:1.36
    volumes:
      - hermes-data:/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HERMES_TELEGRAM_DISABLE_FALLBACK_IPS=${HERMES_TELEGRAM_DISABLE_FALLBACK_IPS}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/bin /data/skills/social-media/linkedin-texto-n8n
        touch /data/.env
        grep -vE '^(OPENROUTER_API_KEY|OPENCODE_GO_API_KEY|OPENCODE_GO_BASE_URL|TELEGRAM_BOT_TOKEN|HERMES_TELEGRAM_DISABLE_FALLBACK_IPS|HERMES_GATEWAY_NO_SUPERVISE|N8N_LINKEDIN_.*_WEBHOOK_URL)=' /data/.env > /data/.env.tmp || true
        mv /data/.env.tmp /data/.env
        printf 'OPENROUTER_API_KEY=%s\n' "$$OPENROUTER_API_KEY" >> /data/.env
        printf 'OPENCODE_GO_API_KEY=%s\n' "$$OPENCODE_GO_API_KEY" >> /data/.env
        printf 'OPENCODE_GO_BASE_URL=%s\n' "$${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}" >> /data/.env
        printf 'TELEGRAM_BOT_TOKEN=%s\n' "$$TELEGRAM_BOT_TOKEN" >> /data/.env
        printf 'HERMES_TELEGRAM_DISABLE_FALLBACK_IPS=%s\n' "$$HERMES_TELEGRAM_DISABLE_FALLBACK_IPS" >> /data/.env
        printf 'N8N_LINKEDIN_POST_WEBHOOK_URL=%s\n' 'https://srv1897392.hstgr.cloud/webhook/hermes-linkedin-post' >> /data/.env
        printf 'N8N_LINKEDIN_MONITOR_WEBHOOK_URL=%s\n' 'https://srv1897392.hstgr.cloud/webhook/hermes-linkedin-monitor' >> /data/.env
        printf 'N8N_LINKEDIN_FOTO_WEBHOOK_URL=%s\n' 'https://srv1897392.hstgr.cloud/webhook/hermes-linkedin-foto' >> /data/.env
        printf 'N8N_LINKEDIN_TEXTO_WEBHOOK_URL=%s\n' 'https://srv1897392.hstgr.cloud/webhook/hermes-linkedin-texto' >> /data/.env
        if ! grep -qE '^N8N_HERMES_WEBHOOK_SECRET=.+' /data/.env; then
          echo 'AVISO: N8N_HERMES_WEBHOOK_SECRET ausente no volume — /salvar-texto e /salvar-foto falharao'
        else
          echo 'secret present (not printed)'
        fi
        cat > /data/bin/salvar-texto-linkedin.sh <<'TXTEOF'
        #!/usr/bin/env sh
        set -eu
        URL="$${N8N_LINKEDIN_TEXTO_WEBHOOK_URL:-https://srv1897392.hstgr.cloud/webhook/hermes-linkedin-texto}"
        SECRET="$${N8N_HERMES_WEBHOOK_SECRET:-}"
        TEXTO=""; FILE=""; TEMA="Post Telegram"
        for candidate in /opt/data/.env /data/.env; do
          if [ -f "$$candidate" ]; then
            if [ -z "$$SECRET" ]; then
              SECRET=$$(grep -E '^N8N_HERMES_WEBHOOK_SECRET=' "$$candidate" | head -1 | cut -d= -f2- || true)
            fi
            if [ -z "$${N8N_LINKEDIN_TEXTO_WEBHOOK_URL:-}" ]; then
              FROM_ENV=$$(grep -E '^N8N_LINKEDIN_TEXTO_WEBHOOK_URL=' "$$candidate" | head -1 | cut -d= -f2- || true)
              if [ -n "$$FROM_ENV" ]; then URL="$$FROM_ENV"; fi
            fi
            break
          fi
        done
        while [ $$# -gt 0 ]; do
          case "$$1" in
            --texto|-x|--text) TEXTO="$$2"; shift 2 ;;
            --file|-f) FILE="$$2"; shift 2 ;;
            --tema|--caption|-c) TEMA="$$2"; shift 2 ;;
            --help|-h) echo "Uso: salvar-texto-linkedin.sh --texto TEXTO"; exit 0 ;;
            *) if [ -z "$$TEXTO" ]; then TEXTO="$$1"; else TEXTO="$$TEXTO $$1"; fi; shift ;;
          esac
        done
        if [ -z "$$SECRET" ]; then echo "ERRO: N8N_HERMES_WEBHOOK_SECRET"; exit 1; fi
        if [ -n "$$FILE" ]; then TEXTO=$$(cat "$$FILE"); fi
        TEXTO=$$(printf '%s' "$$TEXTO" | sed 's/\r$$//')
        if [ -z "$$TEXTO" ]; then echo "ERRO: --texto obrigatorio"; exit 1; fi
        LEN=$$(printf '%s' "$$TEXTO" | wc -c | tr -d ' ')
        if [ "$$LEN" -lt 50 ] || [ "$$LEN" -gt 3000 ]; then echo "ERRO: tamanho $$LEN"; exit 1; fi
        if command -v python3 >/dev/null 2>&1; then PY=python3
        elif command -v python >/dev/null 2>&1; then PY=python
        else echo "ERRO: python necessario"; exit 1; fi
        echo "Enfileirando texto..."
        RESP=$$(POST_TEXT="$$TEXTO" TEMA_TXT="$$TEMA" "$$PY" -c 'import json,os; print(json.dumps({"source":"hermes","command":"salvar-texto","postText":os.environ["POST_TEXT"],"tema":os.environ.get("TEMA_TXT","Post Telegram")[:200]},ensure_ascii=False,separators=(",",":")))' | curl -sS -X POST "$$URL" -H "Content-Type: application/json; charset=utf-8" -H "X-Hermes-Secret: $$SECRET" --data-binary @- -w "\nHTTP_CODE:%{http_code}" --max-time 30) || { echo "ERRO webhook"; exit 1; }
        HTTP_CODE=$$(printf '%s' "$$RESP" | sed -n 's/^HTTP_CODE://p' | tail -1)
        BODY=$$(printf '%s' "$$RESP" | sed '/^HTTP_CODE:/d')
        echo "HTTP $${HTTP_CODE:-?}"
        echo "$$BODY"
        case "$${HTTP_CODE:-}" in
          200|201)
            case "$$BODY" in *'"ok":true'*|*'"ok": true'*) echo "OK texto ready."; exit 0 ;; esac
            ;;
        esac
        echo "ERRO n8n"; exit 1
        TXTEOF
        sed -i 's/^        //' /data/bin/salvar-texto-linkedin.sh
        chmod +x /data/bin/salvar-texto-linkedin.sh
        cat > /data/skills/social-media/linkedin-texto-n8n/SKILL.md <<'SKILLEOF'
        ---
        name: salvar-texto
        description: Salva texto validado no n8n Textos Agenda ready.
        ---
        OBRIGATORIO: /salvar-texto ou "salva este texto" => rode
        /opt/data/bin/salvar-texto-linkedin.sh --texto "<TEXTO>"
        Proibido inventar curl/JSON manual. Destino: LinkedIn Textos Agenda status=ready.
        SKILLEOF
        sed -i 's/^        //' /data/skills/social-media/linkedin-texto-n8n/SKILL.md
        if [ -f /data/config.yaml ]; then
          if grep -qE '^[[:space:]]*salvar-texto:' /data/config.yaml 2>/dev/null; then
            echo 'quick command salvar-texto already present'
          else
            printf '\n  salvar-texto:\n    type: exec\n    description: Enfileirar texto Telegram para o proximo post\n    show_in_telegram_menu: true\n    command: /opt/data/bin/salvar-texto-linkedin.sh\n' >> /data/config.yaml
          fi
        fi
        if [ -f /data/SOUL.md ]; then
          if grep -q 'NUNCA invente curl/JSON manual' /data/SOUL.md 2>/dev/null; then
            echo 'SOUL strong salvar-texto rule present'
          else
            printf '\n\n## LinkedIn salvar texto (OBRIGATORIO)\nQuando Eduardo validar o texto e pedir salvar/enviar (/salvar-texto, salva este texto):\n1. SEMPRE rode /opt/data/bin/salvar-texto-linkedin.sh --texto "<TEXTO>"\n2. NUNCA invente curl/JSON manual.\n3. So confirme apos ver OK texto ready. Grava Textos Agenda ready; /postar usa a fila.\n' >> /data/SOUL.md
          fi
        fi
        if [ -f /data/config.yaml ]; then
          sed -i 's/provider:[[:space:]]*openrouter/provider: opencode-go/' /data/config.yaml || true
          sed -i 's/provider:[[:space:]]*opencode-zen/provider: opencode-go/' /data/config.yaml || true
        fi
        ls -la /data/bin/salvar-texto-linkedin.sh
        head -n 3 /data/bin/salvar-texto-linkedin.sh
        rm -f /data/gateway.pid /data/profiles/default/gateway.pid 2>/dev/null || true
        echo 'config-init done'
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    extra_hosts:
      - "srv1897392.hstgr.cloud:host-gateway"
    restart: unless-stopped
    depends_on:
      config-init:
        condition: service_completed_successfully
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:8090:8090"
    volumes:
      - hermes-data:/opt/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      - HERMES_MODEL=${HERMES_MODEL:-deepseek-v4-flash}
      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-opencode-go}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HERMES_TELEGRAM_DISABLE_FALLBACK_IPS=${HERMES_TELEGRAM_DISABLE_FALLBACK_IPS}
      - N8N_LINKEDIN_POST_WEBHOOK_URL=https://srv1897392.hstgr.cloud/webhook/hermes-linkedin-post
      - N8N_LINKEDIN_MONITOR_WEBHOOK_URL=https://srv1897392.hstgr.cloud/webhook/hermes-linkedin-monitor
      - N8N_LINKEDIN_FOTO_WEBHOOK_URL=https://srv1897392.hstgr.cloud/webhook/hermes-linkedin-foto
      - N8N_LINKEDIN_TEXTO_WEBHOOK_URL=https://srv1897392.hstgr.cloud/webhook/hermes-linkedin-texto
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
volumes:
  hermes-data:
